name: Robo de Shows v2

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  robo-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # necessario para o passo de keepalive conseguir dar push
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar cache do Spotify
        run: echo '${{ secrets.SPOTIFY_CACHE }}' > .spotify_cache

      - name: Criar arquivo .env
        run: |
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> .env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> .env
          echo "SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "BANDSINTOWN_APP_ID=${{ secrets.BANDSINTOWN_APP_ID }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Passo 1 - Buscar artistas do Spotify
        run: python passo1_spotify.py

      - name: Passo 2 - Buscar shows (Gemini grounding + ddgs)
        run: python passo2_buscar_shows.py

      - name: Passo 3 - Enviar notificacoes no Telegram
        run: python passo3_telegram.py

      # O GitHub desativa workflows agendados apos 60 dias sem commits no repo.
      # Foi isso que parou o robo em 08/09/2026. Este passo faz um commit vazio
      # quando o repo passa de 45 dias parado, zerando o contador de inatividade.
      # Roda sempre (if: always()) para proteger mesmo se algum passo acima falhar.
      - name: Keepalive - evita desativacao do agendamento por inatividade
        if: always()
        run: |
          ULTIMO=$(git log -1 --format=%ct)
          AGORA=$(date +%s)
          DIAS=$(( (AGORA - ULTIMO) / 86400 ))
          echo "Dias desde o ultimo commit: $DIAS"
          if [ "$DIAS" -ge 45 ]; then
            echo "Passou de 45 dias: gerando commit de keepalive."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive do agendamento (evita desativacao por inatividade)"
            git push
          else
            echo "Sem necessidade de keepalive."
          fi
